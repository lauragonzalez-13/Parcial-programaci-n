spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Crea el esquema prueba si no existe; el usuario de MySQL debe tener permiso CREATE.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prueba}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&zeroDateTimeBehavior=round
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
clinica.auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME:admin}
clinica.auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:Min2022*}
springdoc.swagger-ui.path=/swagger-ui.html
