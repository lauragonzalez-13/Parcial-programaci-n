spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

#Conexion BD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Crea el esquema prueba si no existe; el usuario de MySQL debe tener permiso CREATE.
spring.datasource.url=jdbc:mysql://localhost:3306/prueba?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&zeroDateTimeBehavior=round
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update 
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
clinica.auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME:admin}
clinica.auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:Min2022*}
